name: Multi-Pair Structure Scanner
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, just after each M15 close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data library
        run: pip install --quiet yfinance pandas
      - name: Scan the whole market and push any setup
        run: python3 market_scan.py setups
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain market_state.json)" ]; then
            git config user.name  "gold-alarm"
            git config user.email "gold-alarm@users.noreply.github.com"
            git add market_state.json
            git commit -m "market state"
            git pull --rebase -q || true
            git push -q
          fi
