name: Gold Market Read
on:
  schedule:
    - cron: '0 */4 * * 1-5'
  workflow_dispatch:
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet yfinance pandas
      - name: Read market and push to phone
        run: python3 gold_brief.py
