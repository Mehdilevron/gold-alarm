name: Gold Zone Alarm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive structure and alert phone
        run: python3 gold_auto.py
      - name: Persist alert state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "gold-alarm"
            git config user.email "gold-alarm@users.noreply.github.com"
            git add state.json
            git commit -m "alert state"
            git pull --rebase -q || true
            git push -q
          else
            echo "no state change"
          fi
