name: Gold Zone Alarm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Check gold price and alert phone
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, json, time, datetime, urllib.request
          NTFY = "https://ntfy.sh/claude-mt5-alerts-7f3k2"

          # --- news filter: high-impact USD releases move gold more than any level ---
          CAL = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          WARN_MIN, LOCK_PRE, LOCK_POST = 60, 30, 20
          KEYWORDS = ("CPI","PPI","FOMC","Federal Funds","Non-Farm","Nonfarm","Unemployment",
                      "Powell","PCE","GDP","Retail Sales","Jobless","ADP","ISM","Payroll","Rate")

          def calendar():
              try:
                  req = urllib.request.Request(CAL, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = json.load(r)
              except Exception as ex:
                  print("calendar error:", ex); return []
              out = []
              for e in raw:
                  t, c, i = e.get("title",""), e.get("country",""), e.get("impact","")
                  if c != "USD": continue
                  if not (i == "High" or (i == "Medium" and any(k.lower() in t.lower() for k in KEYWORDS))):
                      continue
                  try: ts = datetime.datetime.fromisoformat(e["date"].strip()).timestamp()
                  except Exception: continue
                  out.append({"ts": ts, "title": t, "imp": i})
              return sorted(out, key=lambda x: x["ts"])

          def news_state():
              now = time.time()
              for e in calendar():
                  m = (e["ts"] - now) / 60.0
                  if -LOCK_POST <= m <= LOCK_PRE: return "lock", e, m
                  if LOCK_PRE < m <= WARN_MIN:    return "warn", e, m
              return "clear", None, None
          with urllib.request.urlopen("https://api.gold-api.com/price/XAU", timeout=15) as r:
              price = float(json.load(r)["price"])
          print("gold:", price)

          def push(t, m):
              req = urllib.request.Request(NTFY, data=m.encode(),
                  headers={"Title": t, "Priority": "high", "Tags": "rotating_light"}, method="POST")
              urllib.request.urlopen(req, timeout=15); print("PUSHED:", t)

          # Map of 8 Oct 2026. 4H DOWNTREND: lower highs and lower lows, VRVP bias bearish.
          # POC 4184.3, VAH 4196.4, VAL 4145.3. Impulsive 4H drop 4125.9 -> 4066.5, now 4111.
          # Bearish OB 4156.5-4184.4. Imbalance 4127-4140. Bullish OB 4066.5-4087.5.
          # BSL above: 4127, 4140, 4156 equal highs, 4184, 4227.5. SSL below: 4100, 4082, 4066.5, 4030.
          ZONES = [
              {"grade": "A+", "dir": "SHORT @ 4H BEAR-OB", "lo": 4156, "hi": 4185,
               "entry": 4170, "sl": 4186, "tp": (4140, 4111, 4066),
               "note": "4H bearish OB 4156.5-4184.4, origin of the drop, sits under POC 4184. WITH the trend. Needs the sweep of the 4156 equal highs THEN a 5m rejection close back inside."},
              {"grade": "B", "dir": "SHORT @ IMBALANCE", "lo": 4127, "hi": 4140,
               "entry": 4133.5, "sl": 4142, "tp": (4111, 4100, 4082),
               "note": "Shallow 4H imbalance left by the drop. Tight stop, lower conviction than 4170."},
              {"grade": "A", "dir": "LONG @ 4H BULL-OB", "lo": 4066, "hi": 4088,
               "entry": 4077, "sl": 4062, "tp": (4111, 4127, 4156),
               "note": "4066.5-4087.5, base of the recovery, directly above the swept low. Best long but COUNTER-TREND. Sweep + reclaim + 5m BOS, never chase."},
              {"grade": "B", "dir": "SHORT @ POC", "lo": 4178, "hi": 4190,
               "entry": 4184.3, "sl": 4196, "tp": (4156, 4145, 4127),
               "note": "Volume POC, max-liquidity shelf, now overhead supply. Also a magnet, so it can slice straight through. Rejection close required."},
              {"grade": "B", "dir": "SCALP @ VAL", "lo": 4141, "hi": 4150,
               "entry": 4145.3, "sl": 4154, "tp": (4127, 4111, 4100),
               "note": "Value-area low. Short from below it, long only on a close back inside value. Scalp size."},
              {"grade": "C", "dir": "SCALP PIVOT", "lo": 4115, "hi": 4125,
               "entry": 4120, "sl": 4129, "tp": (4100, 4087, 4077),
               "note": "Mid-range pivot. Scalp only, no size, take the first target fast."},
              {"grade": "C", "dir": "SCALP @ INTRADAY SSL", "lo": 4096, "hi": 4104,
               "entry": 4100, "sl": 4089, "tp": (4127, 4140, 4156),
               "note": "Session low liquidity. Counter-trend scalp, only on a sweep and 5m reclaim above 4100."},
              {"grade": "A", "dir": "BREAK WATCH @ SSL", "lo": 4060, "hi": 4068,
               "entry": 4066.5, "sl": 4082, "tp": (4045, 4030, 4010),
               "note": "Swing low. A 4H CLOSE below reopens 4030. A failed break and reclaim is the long, not the short. Decide on the close, never the wick."},
          ]

          if os.environ.get("EVENT") == "workflow_dispatch":
              push("GitHub gold alarm OK (map of 8 Oct)",
                   f"Cloud alarm live 24/7, Mac can be off. Gold {price:.1f}.\n"
                   f"4H bearish. Armed: SHORT 4156-4185 [A+], SHORT 4127-4140 [B], LONG 4066-4088 [A], SSL break watch 4066.5 [A].")
          else:
              state, ev, mins = news_state()
              if state == "lock":
                  when = datetime.datetime.fromtimestamp(ev["ts"]).strftime("%H:%M")
                  if -1 <= mins <= LOCK_PRE:   # announce once, on the way in
                      push(f"GOLD LOCKED - {ev['title']}",
                           f"USD {ev['imp']} impact at {when} server time. Gold {price:.1f}.\n\n"
                           f"-> Setups suppressed until {LOCK_POST} min after the print. "
                           f"Spreads widen and stops get hunted here. Wait for the 5m close that follows it.")
                  print("news lock -", ev["title"]); raise SystemExit(0)

              news_tag = ""
              if state == "warn":
                  news_tag = f"\nNEWS: {ev['title']} in {int(mins)}m - half size, or wait it out.\n"

              for z in ZONES:
                  if z["lo"] - 3 <= price <= z["hi"] + 3:
                      t1, t2, t3 = z["tp"]
                      rr = abs(t2 - z["entry"]) / abs(z["entry"] - z["sl"])
                      push(f"[{z['grade']}] GOLD {z['dir']}",
                           f"ENTRY {z['entry']}\nSL {z['sl']}\nTP1 {t1}\nTP2 {t2}\nTP3 {t3}\n"
                           f"R:R to TP2 = 1:{rr:.1f}\n\n{z['note']}\n\nPrice now {price:.1f}\n"
                           f"-> Confirm the sweep, the 5m BOS and the FVG before placing. No confirmation, no trade.")
                      break
              else:
                  print("no zone near - no alert")
          PY
