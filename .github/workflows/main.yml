name: Gold Zone Alarm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Check gold price and alert phone
        env:
          EVENT: ${{ github.event_name }}
          CRON:  ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os, json, time, datetime, urllib.request
          NTFY = "https://ntfy.sh/claude-mt5-alerts-7f3k2"

          # --- news filter: high-impact USD releases move gold more than any level ---
          CAL = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          WARN_MIN, LOCK_PRE, LOCK_POST = 60, 30, 20
          KEYWORDS = ("CPI","PPI","FOMC","Federal Funds","Non-Farm","Nonfarm","Unemployment",
                      "Powell","PCE","GDP","Retail Sales","Jobless","ADP","ISM","Payroll","Rate",
                      "Inflation","Treasury","Consumer Confidence","Durable Goods","Beige Book")

          def playbook(title):
              t = title.lower()
              if any(k in t for k in ("cpi","ppi","pce","inflation")):
                  return ("HOTTER than forecast -> yields and dollar up -> GOLD DOWN.\n"
                          "COOLER than forecast -> rate-cut bets up -> GOLD UP.\n"
                          "Watch the CORE number. The first spike often reverses within 15 min.")
              if any(k in t for k in ("fomc","federal funds","powell","meeting minutes","beige book")):
                  return ("HAWKISH -> GOLD DOWN. DOVISH -> GOLD UP.\n"
                          "Two-way whipsaw is normal; do not trade the first candle.")
              if any(k in t for k in ("non-farm","nonfarm","payroll","adp","unemployment","jobless","employment")):
                  return ("STRONG jobs -> dollar up -> GOLD DOWN. WEAK jobs -> cuts priced -> GOLD UP.\n"
                          "Revisions to the prior month matter as much as the print.")
              if any(k in t for k in ("retail sales","gdp","ism","consumer confidence","durable goods")):
                  return ("STRONG growth -> GOLD DOWN. WEAK growth -> GOLD UP, unless it reads as risk-off "
                          "and gold catches a haven bid. Lower conviction than inflation or jobs.")
              return "Direction is not mechanical here. Expect widened spreads and a sweep both ways first."

          def calendar():
              try:
                  req = urllib.request.Request(CAL, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = json.load(r)
              except Exception as ex:
                  print("calendar error:", ex); return []
              out = []
              for e in raw:
                  t, c, i = e.get("title",""), e.get("country",""), e.get("impact","")
                  # every High-impact event on the calendar, plus the dollar's second tier
                  if not (i == "High" or (c == "USD" and i == "Medium"
                                          and any(k.lower() in t.lower() for k in KEYWORDS))):
                      continue
                  try: ts = datetime.datetime.fromisoformat(e["date"].strip()).timestamp()
                  except Exception: continue
                  out.append({"ts": ts, "title": t, "imp": i, "cur": c,
                              "fc": e.get("forecast","") or "n/a",
                              "pv": e.get("previous","") or "n/a"})
              return sorted(out, key=lambda x: x["ts"])

          def news_state():
              now = time.time()
              for e in calendar():
                  m = (e["ts"] - now) / 60.0
                  if -LOCK_POST <= m <= LOCK_PRE: return "lock", e, m
                  if LOCK_PRE < m <= WARN_MIN:    return "warn", e, m
              return "clear", None, None
          with urllib.request.urlopen("https://api.gold-api.com/price/XAU", timeout=15) as r:
              price = float(json.load(r)["price"])
          print("gold:", price)

          def push(t, m):
              req = urllib.request.Request(NTFY, data=m.encode(),
                  headers={"Title": t, "Priority": "high", "Tags": "rotating_light"}, method="POST")
              urllib.request.urlopen(req, timeout=15); print("PUSHED:", t)

          # Map of 12 Oct 2026, LATE. The rising structure off 4066.5 is BROKEN:
          # the 4H closed 4165.3, below the 4168 invalidation, after a 4217.4 high.
          # First lower high 4196.1, first lower low 4154.7. Short-term lean is now DOWN.
          # Flipped supply: 4184-4192 (old demand), 4193-4202 (breakdown origin), 4217-4229 shelf.
          # SSL below: 4154.7, 4143, 4121, 4103, 4082, 4066.5. A 4H close under 4143 opens 4103.
          ZONES = [
              {"grade": "A+", "dir": "SHORT @ FLIPPED DEMAND", "lo": 4184, "hi": 4192,
               "entry": 4188, "sl": 4203, "tp": (4165, 4154, 4143),
               "note": "The 4184-4192 demand that failed is now supply, and it sits under the first lower high. WITH the new lean. Needs the sweep into it THEN a 5m close back below 4184 and a BOS. Invalid on a 4H close above 4202."},
              {"grade": "A", "dir": "SHORT @ BREAKDOWN ORIGIN", "lo": 4193, "hi": 4202,
               "entry": 4197, "sl": 4210, "tp": (4174, 4160, 4143),
               "note": "Where the 4H breakdown began, capped by the 4196.1 lower high. Deeper retrace, tighter risk, same direction."},
              {"grade": "A", "dir": "LONG @ 4H BULL-OB", "lo": 4143, "hi": 4156,
               "entry": 4150, "sl": 4134, "tp": (4168, 4184, 4196),
               "note": "4143-4156 already produced the bounce from 4154.7. COUNTER-TREND now that structure has broken: sweep, reclaim, 5m BOS, scalp size only."},
              {"grade": "B", "dir": "SHORT @ 4217 SHELF", "lo": 4217, "hi": 4229,
               "entry": 4224, "sl": 4238, "tp": (4196, 4184, 4168),
               "note": "The equal-high shelf. Far above price and only reachable on a full reclaim, which would also undo the breakdown."},
              {"grade": "B", "dir": "LONG @ RANGE LOW", "lo": 4121, "hi": 4133,
               "entry": 4127, "sl": 4112, "tp": (4143, 4156, 4168),
               "note": "Prior consolidation floor beneath. Only once 4143 has failed and held as resistance."},
              {"grade": "C", "dir": "SCALP @ 4103 SSL", "lo": 4098, "hi": 4108,
               "entry": 4103, "sl": 4092, "tp": (4121, 4133, 4143),
               "note": "Deeper session liquidity. Scalp only, no size, first target taken fast."},
              {"grade": "C", "dir": "SCALP PIVOT", "lo": 4166, "hi": 4176,
               "entry": 4171, "sl": 4181, "tp": (4160, 4154, 4143),
               "note": "Where price sits now, between the broken level and the bounce low. No edge: skip it unless 4184 stays untested."},
              {"grade": "A", "dir": "BREAK WATCH @ 4143", "lo": 4138, "hi": 4146,
               "entry": 4143, "sl": 4158, "tp": (4121, 4103, 4082),
               "note": "The last 4H demand. A CLOSE below 4143 opens 4103 and then 4082. A failed break and reclaim is the long, not the short. Decide on the close, never the wick."},
          ]

          # ---- A+ ONLY, AND ONLY AFTER A CONFIRMED STRUCTURE BREAK ----
          # User's standing rule: no zone-touch alerts, no news pushes, no diary.
          # Fire once price has swept an A+ zone AND closed back out of it AND
          # broken the opposing 5m swing. Anything less is printed, never pushed.
          APLUS = [z for z in ZONES if z["grade"] == "A+"]

          def bars5m():
              url = ("https://query1.finance.yahoo.com/v8/finance/chart/GC=F"
                     "?interval=5m&range=2d")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  q = json.load(r)["chart"]["result"][0]["indicators"]["quote"][0]
              out = []
              for o, h, l, c in zip(q["open"], q["high"], q["low"], q["close"]):
                  if None in (o, h, l, c): continue
                  out.append({"o": o, "h": h, "l": l, "c": c})
              return out

          raw = bars5m()
          if not raw:
              print("no 5m data - silent"); raise SystemExit(0)
          # Yahoo quotes COMEX futures; shift them onto the spot price the zones are drawn on.
          off = price - raw[-1]["c"]
          B = [{k: v + off for k, v in b.items()} for b in raw][-40:]
          print(f"5m bars {len(B)}, futures offset {off:+.1f}")

          state, ev, mins = news_state()
          if state == "lock":
              print("news lock -", ev["title"], "- silent"); raise SystemExit(0)

          fired = False
          for z in APLUS:
              look = B[-8:]
              swept = any(b["l"] <= z["hi"] and b["h"] >= z["lo"] for b in look[:-1])
              last = B[-1]
              if not swept: print(z["dir"], "- no sweep yet"); continue
              if "LONG" in z["dir"]:
                  reclaimed = last["c"] > z["hi"]
                  swing = max(b["h"] for b in B[-12:-1])
                  bos = last["c"] > swing
              else:
                  reclaimed = last["c"] < z["lo"]
                  swing = min(b["l"] for b in B[-12:-1])
                  bos = last["c"] < swing
              if not (reclaimed and bos):
                  print(z["dir"], f"- swept, waiting: reclaim={reclaimed} bos={bos}"); continue
              t1, t2, t3 = z["tp"]
              rr = abs(t2 - z["entry"]) / abs(z["entry"] - z["sl"])
              push(f"[A+ CONFIRMED] GOLD {z['dir']}",
                   f"Structure has broken. Sweep of {z['lo']}-{z['hi']}, 5m close back out, "
                   f"and 5m BOS through {swing:.1f}.\n\n"
                   f"ENTRY {z['entry']}\nSL {z['sl']}\nTP1 {t1}\nTP2 {t2}\nTP3 {t3}\n"
                   f"R:R to TP2 = 1:{rr:.1f}\n\n{z['note']}\n\nPrice now {price:.1f}")
              fired = True
              break
          if not fired:
              print("no confirmed A+ structure break - nothing sent")
          PY
