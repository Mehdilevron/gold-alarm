name: Gold Zone Alarm
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 5 * * 1-5'   # daily gold news agenda
  workflow_dispatch:
jobs:
  check-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Check gold price and alert phone
        env:
          EVENT: ${{ github.event_name }}
          CRON:  ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os, json, time, datetime, urllib.request
          NTFY = "https://ntfy.sh/claude-mt5-alerts-7f3k2"

          # --- news filter: high-impact USD releases move gold more than any level ---
          CAL = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          WARN_MIN, LOCK_PRE, LOCK_POST = 60, 30, 20
          KEYWORDS = ("CPI","PPI","FOMC","Federal Funds","Non-Farm","Nonfarm","Unemployment",
                      "Powell","PCE","GDP","Retail Sales","Jobless","ADP","ISM","Payroll","Rate",
                      "Inflation","Treasury","Consumer Confidence","Durable Goods","Beige Book")

          def playbook(title):
              t = title.lower()
              if any(k in t for k in ("cpi","ppi","pce","inflation")):
                  return ("HOTTER than forecast -> yields and dollar up -> GOLD DOWN.\n"
                          "COOLER than forecast -> rate-cut bets up -> GOLD UP.\n"
                          "Watch the CORE number. The first spike often reverses within 15 min.")
              if any(k in t for k in ("fomc","federal funds","powell","meeting minutes","beige book")):
                  return ("HAWKISH -> GOLD DOWN. DOVISH -> GOLD UP.\n"
                          "Two-way whipsaw is normal; do not trade the first candle.")
              if any(k in t for k in ("non-farm","nonfarm","payroll","adp","unemployment","jobless","employment")):
                  return ("STRONG jobs -> dollar up -> GOLD DOWN. WEAK jobs -> cuts priced -> GOLD UP.\n"
                          "Revisions to the prior month matter as much as the print.")
              if any(k in t for k in ("retail sales","gdp","ism","consumer confidence","durable goods")):
                  return ("STRONG growth -> GOLD DOWN. WEAK growth -> GOLD UP, unless it reads as risk-off "
                          "and gold catches a haven bid. Lower conviction than inflation or jobs.")
              return "Direction is not mechanical here. Expect widened spreads and a sweep both ways first."

          def calendar():
              try:
                  req = urllib.request.Request(CAL, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = json.load(r)
              except Exception as ex:
                  print("calendar error:", ex); return []
              out = []
              for e in raw:
                  t, c, i = e.get("title",""), e.get("country",""), e.get("impact","")
                  # every High-impact event on the calendar, plus the dollar's second tier
                  if not (i == "High" or (c == "USD" and i == "Medium"
                                          and any(k.lower() in t.lower() for k in KEYWORDS))):
                      continue
                  try: ts = datetime.datetime.fromisoformat(e["date"].strip()).timestamp()
                  except Exception: continue
                  out.append({"ts": ts, "title": t, "imp": i, "cur": c,
                              "fc": e.get("forecast","") or "n/a",
                              "pv": e.get("previous","") or "n/a"})
              return sorted(out, key=lambda x: x["ts"])

          def news_state():
              now = time.time()
              for e in calendar():
                  m = (e["ts"] - now) / 60.0
                  if -LOCK_POST <= m <= LOCK_PRE: return "lock", e, m
                  if LOCK_PRE < m <= WARN_MIN:    return "warn", e, m
              return "clear", None, None
          with urllib.request.urlopen("https://api.gold-api.com/price/XAU", timeout=15) as r:
              price = float(json.load(r)["price"])
          print("gold:", price)

          def push(t, m):
              req = urllib.request.Request(NTFY, data=m.encode(),
                  headers={"Title": t, "Priority": "high", "Tags": "rotating_light"}, method="POST")
              urllib.request.urlopen(req, timeout=15); print("PUSHED:", t)

          # Map of 12 Oct 2026. 4H UPTREND off the 4066.5 swing low: higher highs, higher lows.
          # Price 4204.8. Rising lows 4066.5 -> 4103 -> 4121 -> 4143 -> 4174 -> 4184.8 -> 4200.
          # BSL overhead: 4217.4, 4219.4, 4225.4, 4227.5 equal highs = one liquidity shelf.
          # Demand on the way up: 4184.8-4191.6, 4143-4156 (origin of the 4143->4186 impulse), 4121-4133.
          # SSL below: 4168.5, 4143, 4121, 4103, 4082, 4066.5. Structure breaks on a 4H CLOSE under 4168.
          ZONES = [
              {"grade": "A+", "dir": "LONG @ 4H DEMAND", "lo": 4184, "hi": 4192,
               "entry": 4188, "sl": 4172, "tp": (4210, 4227, 4248),
               "note": "4184.8-4191.6, the shelf price broke out from and the last higher low. WITH the trend. Needs a sweep into it THEN a 5m rejection close back up. Invalid on a 4H close below 4168."},
              {"grade": "A", "dir": "SHORT @ BSL SWEEP", "lo": 4217, "hi": 4229,
               "entry": 4224, "sl": 4238, "tp": (4205, 4191, 4174),
               "note": "4217.4/4219.4/4225.4/4227.5 equal highs, the only real supply overhead. COUNTER-TREND: scalp size, requires the wick through and a 5m close back below 4217. A 4H CLOSE above 4227.5 kills this and is the long."},
              {"grade": "A", "dir": "LONG @ 4H BULL-OB", "lo": 4143, "hi": 4156,
               "entry": 4149, "sl": 4131, "tp": (4174, 4191, 4210),
               "note": "Origin of the impulse 4143 -> 4186. Deeper, better priced, still with the trend. Sweep + reclaim + 5m BOS, never chase into it."},
              {"grade": "B", "dir": "LONG @ IMBALANCE", "lo": 4168, "hi": 4176,
               "entry": 4172, "sl": 4160, "tp": (4191, 4204, 4217),
               "note": "Shallow 4H imbalance and the first support under price. Tight stop, lower conviction than 4188."},
              {"grade": "B", "dir": "LONG @ RANGE LOW", "lo": 4121, "hi": 4133,
               "entry": 4127, "sl": 4112, "tp": (4150, 4168, 4186),
               "note": "Prior consolidation floor. Only if 4143 fails and holds as resistance; otherwise this is a broken market, not a dip."},
              {"grade": "C", "dir": "SCALP @ 4103 SSL", "lo": 4098, "hi": 4108,
               "entry": 4103, "sl": 4092, "tp": (4121, 4133, 4143),
               "note": "Session-low liquidity. Scalp only, no size, first target taken fast."},
              {"grade": "C", "dir": "SCALP PIVOT", "lo": 4196, "hi": 4204,
               "entry": 4200, "sl": 4190, "tp": (4212, 4219, 4227),
               "note": "Mid-structure pivot where price sits now. Scalp only, and skip it if the 4188 demand is still untested."},
              {"grade": "A", "dir": "BREAK WATCH @ BSL", "lo": 4227, "hi": 4234,
               "entry": 4227.5, "sl": 4208, "tp": (4248, 4265, 4290),
               "note": "All-time shelf. A 4H CLOSE above 4227.5 opens clear air. A failed break and reclaim below is the short, not the long. Decide on the close, never the wick."},
          ]

          if os.environ.get("CRON") == "0 5 * * 1-5":
              now = time.time(); day = datetime.datetime.now().date()
              todays = [e for e in calendar()
                        if datetime.datetime.fromtimestamp(e["ts"]).date() == day and e["ts"] > now]
              if todays:
                  lines = [f"{datetime.datetime.fromtimestamp(e['ts']):%H:%M}  {e['cur']} [{e['imp']}]  {e['title']}"
                           f"\n     fc {e['fc']} | prev {e['pv']}" for e in todays]
                  push(f"GOLD DIARY - {len(todays)} event(s) today",
                       f"Gold {price:.1f}.\n\n" + "\n".join(lines) +
                       f"\n\n-> You get a separate alert one hour before each one, with the direction rule. "
                       f"Entries are suppressed from 30 min before to 20 min after.")
              else:
                  push("GOLD DIARY - clear day",
                       f"Gold {price:.1f}. No high-impact releases scheduled today. Levels run unfiltered.")
              raise SystemExit(0)

          if os.environ.get("EVENT") == "workflow_dispatch":
              push("GitHub gold alarm OK (map of 12 Oct)",
                   f"Cloud alarm live 24/7, Mac can be off. Gold {price:.1f}.\n"
                   f"4H bullish. Armed: LONG 4184-4192 [A+], SHORT 4217-4229 [A], LONG 4143-4156 [A], BSL break watch 4227.5 [A].")
          else:
              state, ev, mins = news_state()
              if state == "lock":
                  when = datetime.datetime.fromtimestamp(ev["ts"]).strftime("%H:%M")
                  if -1 <= mins <= LOCK_PRE:   # announce once, on the way in
                      push(f"GOLD LOCKED - {ev['title']}",
                           f"USD {ev['imp']} impact at {when} server time. Gold {price:.1f}.\n\n"
                           f"-> Setups suppressed until {LOCK_POST} min after the print. "
                           f"Spreads widen and stops get hunted here. Wait for the 5m close that follows it.")
                  print("news lock -", ev["title"]); raise SystemExit(0)

              news_tag = ""
              if state == "warn":
                  news_tag = f"\nNEWS: {ev['title']} in {int(mins)}m - half size, or wait it out.\n"
                  # fires once: only the run that first crosses the 60-minute mark
                  if 55 <= mins <= 60:
                      when = datetime.datetime.fromtimestamp(ev["ts"]).strftime("%H:%M")
                      push(f"GOLD NEWS IN 1 HOUR - {ev['cur']} {ev['title']}",
                           f"{ev['imp']} impact at {when} server time.\n"
                           f"Forecast {ev['fc']} | Previous {ev['pv']}\n"
                           f"Gold now {price:.1f}.\n\n"
                           f"WHICH WAY:\n{playbook(ev['title'])}\n\n"
                           f"-> Bank open scalps or move the stop to break-even. "
                           f"No new entries inside 30 minutes of the release.")

              for z in ZONES:
                  if z["lo"] - 3 <= price <= z["hi"] + 3:
                      t1, t2, t3 = z["tp"]
                      rr = abs(t2 - z["entry"]) / abs(z["entry"] - z["sl"])
                      push(f"[{z['grade']}] GOLD {z['dir']}",
                           f"ENTRY {z['entry']}\nSL {z['sl']}\nTP1 {t1}\nTP2 {t2}\nTP3 {t3}\n"
                           f"R:R to TP2 = 1:{rr:.1f}\n\n{z['note']}\n\nPrice now {price:.1f}\n"
                           f"-> Confirm the sweep, the 5m BOS and the FVG before placing. No confirmation, no trade.")
                      break
              else:
                  print("no zone near - no alert")
          PY
