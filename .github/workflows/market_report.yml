name: Full Market Report
on:
  schedule:
    # 03:10 UTC = 07:10 Dubai, and 12:10 UTC = 16:10 Dubai, weekdays
    - cron: '10 3,12 * * 1-5'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data library
        run: pip install --quiet yfinance pandas
      - name: Build the full market report and push to phone
        run: python3 market_scan.py report
